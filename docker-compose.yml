name: foundly-lab

services:
  db:
    image: mysql:8.4
    restart: on-failure
    environment:
      MYSQL_DATABASE: foundly
      MYSQL_USER: foundly_lab
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schemaDB.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/db_password)"
          mysql --protocol=TCP --host=127.0.0.1 --user=foundly_lab --ssl-mode=REQUIRED
          foundly --execute='SELECT 1 FROM utente LIMIT 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    image: foundly:lab2
    build: .
    restart: on-failure
    ports:
      - "127.0.0.1:18083:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://db:3306/foundly?sslMode=REQUIRED&connectTimeout=5000"
      DB_USER: foundly_lab
    secrets:
      - db_password
    command:
      - /bin/sh
      - -ec
      - |
        DB_PASSKEY="$$(cat /run/secrets/db_password)"
        test -n "$$DB_PASSKEY"
        export DB_PASSKEY
        exec catalina.sh run
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:8080/Foundly/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

secrets:
  db_password:
    file: ./.local-secrets/db-password
  db_root_password:
    file: ./.local-secrets/db-root-password

volumes:
  db_data:
